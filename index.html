<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happiness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Daily Happiness Tracker</h1>
    <p>Enter your happiness score for today (0-10):</p>
    <input type="number" id="score" min="0" max="10" step="1">
    <button id="submit">Submit</button>
    <h2>Average happiness: <span id="average">0</span></h2>
    <ul id="log"></ul>
    <script src="script.js"></script>
</body>
</html>
